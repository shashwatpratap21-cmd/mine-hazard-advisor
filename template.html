<style>
/* Mine Hazard Advisor: restrained industrial console. 30% input / 70% evidence.
   Single dark theme by design; every colour defined here. */
:root{
  color-scheme:dark;
  --bg:#090C0F; --surface:#10161B; --surface-2:#141B21; --inset:#0B1014;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#EEF2F5; --text-2:#A3AFB8; --text-3:#76838D;
  --silver:#C9D2D8;
  --amber:#F2B544; --amber-hi:#FFD27A; --amber-ink:#1C1305; --amber-a:rgba(242,181,68,.12);
  --red:#F2665F; --red-a:rgba(242,102,95,.12);
  --steel:#6F8794;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px; --s6:40px;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset,0 2px 12px rgba(0,0,0,.26);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -200px,rgba(160,180,195,.06),transparent 70%);
  color:var(--text);font:17px/1.6 var(--body);padding-inline:24px;padding-block:0 72px}
@media (max-width:600px){body{padding-inline:16px;font-size:16px}}
.wrap{max-width:1320px;margin:0 auto}
:focus-visible{outline:2px solid var(--amber-hi);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:var(--s2);padding-block:var(--s4);border-bottom:1px solid var(--line)}
.emblem{width:40px;height:40px;flex:none}
h1{font:700 clamp(1.7rem,3vw,2.15rem)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--silver)}
.tag{margin:4px 0 0;color:var(--text-3);font-size:.92rem}

/* layout */
main{display:grid;grid-template-columns:minmax(300px,3fr) minmax(0,7fr);gap:var(--s5);margin-top:var(--s5);align-items:start}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr);gap:28px;margin-top:28px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.label{font:500 .9rem/1.3 var(--body);letter-spacing:.01em;color:var(--text-2)}

/* input console */
form{padding:var(--s4);display:grid;gap:var(--s4);position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
@media (max-width:980px){form{position:static}}
.form-h{font:700 1.3rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);margin:0}
.field{display:grid;gap:8px}
textarea,select{font:inherit;font-size:1rem;color:var(--text);background:var(--inset);border:1px solid var(--line-2);border-radius:var(--r-sm);width:100%;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);transition:border-color .15s,box-shadow .15s}
textarea{min-height:150px;resize:vertical;line-height:1.55;padding:14px 16px;caret-color:var(--amber)}
textarea::placeholder{color:var(--text-3)}
select{appearance:none;-webkit-appearance:none;padding:11px 36px 11px 14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--surface);color:var(--text)}
textarea:hover,select:hover{border-color:rgba(255,255,255,.2)}
textarea:focus,select:focus{outline:none;border-color:rgba(242,181,68,.7);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(242,181,68,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.chips{display:grid;gap:var(--s1)}
.chip{font:400 .9rem/1.35 var(--body);color:var(--text-2);background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--line-2);background:#19212A;box-shadow:inset 2px 0 0 var(--amber);font-weight:500}
.go{display:flex;align-items:center;justify-content:center;gap:10px;font:700 1.15rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink);
  border:1px solid #9A6B17;border-radius:var(--r-sm);padding:15px 18px;cursor:pointer;
  min-height:52px;background:linear-gradient(180deg,#F8C762 0%,var(--amber) 60%,#E3A537 100%);
  box-shadow:inset 0 1px 0 rgba(255,245,220,.55),0 2px 6px rgba(0,0,0,.35);transition:filter .15s,transform .08s,box-shadow .15s}
.go:hover{filter:brightness(1.05)}
.go:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(90,55,5,.4)}
.go[disabled]{filter:saturate(.7) brightness(.9);cursor:progress}
.go .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(28,19,5,.3);border-top-color:var(--amber-ink);display:none}
.go.busy .spin{display:inline-block}
@media (prefers-reduced-motion:no-preference){.go.busy .spin{animation:spin .7s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* results */
section.out{display:grid;gap:var(--s6);min-width:0}
.block{display:grid;gap:var(--s3)}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.sec-h h2{font:700 1.55rem/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--text)}
.sec-h .sub{font-size:.95rem;color:var(--text-2)}

/* hazard panel */
.hazard{padding:var(--s5);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;
  border-color:rgba(242,181,68,.22);background:linear-gradient(180deg,#141B20,#0F1418);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 14px rgba(0,0,0,.3)}
@media (max-width:720px){.hazard{grid-template-columns:minmax(0,1fr);gap:26px;padding:22px}}
.hz-main{display:grid;gap:var(--s3);align-content:start;min-width:0}
.hz-title{display:flex;align-items:center;gap:16px;min-width:0}
.hz-icon{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--amber);background:var(--amber-a);border:1px solid rgba(242,181,68,.3)}
.hz-icon svg{width:28px;height:28px}
.hz-name{font:700 clamp(2rem,3.4vw,2.7rem)/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;color:#fff;min-width:0;overflow-wrap:break-word}
.hz-name.long{font-size:clamp(1.6rem,2.6vw,2.1rem)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .v{font:500 1.6rem/1 var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.score .k{font-size:.95rem;color:var(--text-2)}
.badge{display:inline-flex;align-items:center;gap:7px;font:600 .82rem/1 var(--body);letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.hi{color:var(--amber-hi);border-color:rgba(242,181,68,.45);background:var(--amber-a)}
.badge.mid{color:#E2D2AE;border-color:rgba(226,210,174,.3);background:rgba(226,210,174,.06)}
.badge.lo{color:var(--text-2);border-color:var(--line-2);background:rgba(255,255,255,.03)}
.gauge{height:8px;border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.gauge b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#C88A22,var(--amber-hi))}
.interp{margin:0;font-size:.92rem;line-height:1.55;color:var(--text-2)}
.alts{display:grid;gap:var(--s3);align-content:start;min-width:0;padding-left:var(--s5);border-left:1px solid var(--line)}
@media (max-width:720px){.alts{padding-left:0;border-left:0;padding-top:22px;border-top:1px solid var(--line)}}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.98rem;color:var(--text-2)}
.bar .p{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2)}
.bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--inset);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:3px;background:#5F7480}
.bar.top{color:var(--text);font-weight:600} .bar.top .p{color:var(--amber-hi)}
.bar.top .fill{background:linear-gradient(90deg,#C88A22,var(--amber-hi))}
@media (prefers-reduced-motion:no-preference){.bar .fill,.gauge b{transition:width .6s cubic-bezier(.2,.8,.2,1)}}

/* preventive measures */
.acts{margin:0;padding:0;list-style:none;display:grid;gap:var(--s2)}
.act{display:grid;grid-template-columns:32px minmax(0,1fr);gap:6px var(--s3);padding:var(--s3) var(--s4);min-height:84px;align-content:center}
.act .num{grid-row:1/3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 .95rem/1 var(--mono);color:var(--text-2);border:1px solid var(--line-2);background:var(--inset)}
.act .t{font-size:1.04rem;line-height:1.55;color:var(--text);max-width:68ch}
.act:first-child{box-shadow:var(--shadow),inset 2px 0 0 var(--amber)}
.act:first-child .num{color:var(--amber-hi);border-color:rgba(242,181,68,.5)}
.ev{font-size:.92rem;color:var(--text-2)}
.ev summary{cursor:pointer;width:fit-content}
.ev summary:hover{color:var(--text-2)}
.ev p{margin:6px 0 0;font-family:var(--mono);font-size:.88rem;color:var(--text-2)}

/* advisory */
.advice{padding:var(--s4);display:grid;gap:var(--s3)}
.advice .why{margin:0;color:var(--text-2);max-width:70ch}
.advice-body{white-space:pre-wrap;max-width:72ch;padding:16px 18px;border-radius:var(--r-sm);background:var(--inset);border:1px solid var(--line)}
.advice-body:empty{display:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn2{font:600 1rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--text);cursor:pointer;padding:12px 18px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface-2);transition:border-color .15s,background .15s}
.btn2:hover{border-color:rgba(242,181,68,.5);background:#182027}
.btn2[disabled]{opacity:.5;cursor:default}
.note{font-size:.9rem;color:var(--text-2);margin:0}
.note:empty{display:none}

/* accident cards */
.cases{display:grid;gap:var(--s2)}
.case{padding:var(--s4);display:grid;gap:var(--s3);min-width:0}
.case-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.rid{font:500 .86rem/1 var(--mono);color:var(--text-2);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;background:var(--inset)}
.mine{font:600 1.18rem/1.3 var(--body);color:var(--text);margin:0}
.yr{font:500 .98rem var(--mono);color:var(--text-2)}
.killed{margin-left:auto;font:600 .88rem/1 var(--body);color:var(--red);background:var(--red-a);border:1px solid rgba(242,102,95,.35);padding:6px 10px;border-radius:999px;white-space:nowrap}
.sit{margin:0;color:#D5DDE2;max-width:74ch}
.findings{display:grid;gap:8px}
.findings h4{margin:0;font:500 .9rem/1.3 var(--body);color:var(--text-2)}
.lessons{margin:0;padding:0 0 0 18px;display:grid;gap:6px;color:var(--text);max-width:74ch}
.lessons li::marker{color:var(--amber)}
.src{font:400 .9rem/1.5 var(--mono);color:var(--text-2)}
.src b{color:var(--text)}
.src b{color:var(--text-2);font-weight:500}
details.more summary{cursor:pointer;width:fit-content;font:600 .9rem/1 var(--body);color:var(--text-2);padding:2px 0}
details.more summary:hover{color:var(--text)}
.full{display:grid;gap:var(--s2);margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px var(--s3);font-size:.95rem}
.kv dt{color:var(--text-2)} .kv dd{margin:0;color:var(--text-2);min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr);gap:0}.kv dd{margin-bottom:8px}}
.measures{margin:0;padding:0 0 0 18px;display:grid;gap:8px;color:var(--text-2);max-width:78ch;font-size:.95rem}
.measures li::marker{color:var(--text-3)}
.measures em{font-style:normal;font-weight:600;color:var(--text)}

.empty{display:flex;gap:16px;align-items:center;padding:26px 28px;color:var(--text-2)}
.empty svg{width:34px;height:34px;flex:none;color:var(--amber)}
.empty p{margin:0;max-width:62ch} .empty b{color:var(--text)}
@media (prefers-reduced-motion:no-preference){.reveal{animation:rise .35s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.notice{padding:var(--s3) var(--s4);border-radius:var(--r);border:1px solid rgba(242,181,68,.3);background:rgba(242,181,68,.06);color:var(--text-2);font-size:.98rem}
.notice b{color:var(--text)}
.partial{margin:0;color:var(--text-2);font-size:.95rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s1)}
.pager .pg{color:var(--text-2);font-size:.95rem;text-align:center;flex:1}
.empty>div{min-width:0}
.notice.warn{border-color:rgba(242,102,95,.4);background:var(--red-a)}
.notice code{font-family:var(--mono);font-size:.9em}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prov{font:600 .74rem/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:6px;border:1px solid}
.prov.hist{color:#BFD3DE;border-color:rgba(111,135,148,.55);background:rgba(111,135,148,.12)}
.prov.syn{color:#D9C6F2;border-color:rgba(190,160,235,.45);background:rgba(190,160,235,.10)}
.prov.pot{color:var(--amber-hi);border-color:rgba(242,181,68,.45);background:var(--amber-a)}
.prov.cat{color:var(--text-2);border-color:var(--line-2);background:transparent;text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:500}
.xpanel{padding:var(--s5);display:grid;gap:var(--s3);border-color:rgba(190,160,235,.22)}
@media (max-width:720px){.xpanel{padding:22px}}
.xp-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.xp-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px}
@media (max-width:720px){.xp-grid{grid-template-columns:minmax(0,1fr);gap:22px}}
.xp-main{display:grid;gap:var(--s3);align-content:start;min-width:0}
.xp-cat{font:700 clamp(1.45rem,2.4vw,1.9rem)/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;color:#fff;overflow-wrap:break-word}
.xkv{grid-template-columns:170px minmax(0,1fr)}
@media (max-width:560px){.xkv{grid-template-columns:minmax(0,1fr)}}
.xkv .pill{display:inline-block;font:500 .82rem/1 var(--mono);color:var(--text-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 7px;margin:0 4px 4px 0}
.subj{margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line);display:grid;gap:8px}
.subj ul{margin:0;padding-left:18px;color:var(--text);display:grid;gap:4px}
.syncard{padding:var(--s3) var(--s4);border-radius:var(--r);border:1px dashed rgba(190,160,235,.35);background:rgba(190,160,235,.04);display:grid;gap:10px;min-width:0}
.syn-t{margin:0;color:var(--text);font-size:1rem}
.linkbtn{justify-self:start;background:none;border:0;padding:0;color:var(--text-2);font:500 .92rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--text)}
.cause{margin:0;color:var(--text-2);font-size:.95rem}
.cause b{color:var(--text);font-weight:500}
.prov.src{color:var(--text-2);border-color:var(--line-2);background:rgba(255,255,255,.03)}
.prov.ok{color:#9FE0C0;border-color:rgba(85,214,160,.4);background:rgba(85,214,160,.08)}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gcard .t{font-weight:500}
.gev{display:grid;gap:6px;margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--inset);border:1px solid var(--line);font-size:.92rem;color:var(--text-2)}
.gev p{margin:0} .gev ul{margin:0;padding-left:18px;display:grid;gap:8px}
.gev b{color:var(--text);font-weight:500}
.glabel{margin-top:6px!important;font:600 .78rem/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
</style>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const STOP = new Set(D.stop);
const KB = D.kb.map(r => Object.fromEntries(D.kbcols.map((c,i)=>[c,r[i]])));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// sklearn TfidfVectorizer: lowercase, token_pattern \b\w\w+\b, english stop words, ngram (1,2), sublinear tf, l2
function index(terms){ const m=new Map(); terms.forEach((t,i)=>m.set(t,i)); return m; }
const CLF_IDX = index(D.clf.terms), RET_IDX = index(D.ret.terms);
function vectorize(text, idx, idf){
  const toks = (text.toLowerCase().match(/[\p{L}\p{N}_]{2,}/gu) || []).filter(t=>!STOP.has(t));
  const grams = toks.slice(); for(let i=0;i<toks.length-1;i++) grams.push(toks[i]+" "+toks[i+1]);
  const tf = new Map(); for(const g of grams){ const j=idx.get(g); if(j!==undefined) tf.set(j,(tf.get(j)||0)+1); }
  let norm=0; const v=new Map();
  for(const [j,c] of tf){ const w=(1+Math.log(c))*idf[j]; v.set(j,w); norm+=w*w; }
  norm=Math.sqrt(norm)||1; for(const [j,w] of v) v.set(j,w/norm);
  return v;
}
function classify(text){
  const v = vectorize(text, CLF_IDX, D.clf.idf);
  const z = D.clf.coef.map((row,k)=>{ let s=D.clf.intercept[k]; for(const [j,w] of v) s+=row[j]*w; return s; });
  const mx=Math.max(...z), e=z.map(x=>Math.exp(x-mx)), sum=e.reduce((a,b)=>a+b,0);
  return D.clf.classes.map((c,k)=>({hazard:c,p:e[k]/sum})).sort((a,b)=>b.p-a.p);
}
const DOCS = D.ret.docs.map(([ix,vals])=>{ const m=new Map(); ix.forEach((j,i)=>m.set(j,vals[i])); return m; });
function search(text, {k=6, place="", mineType="", hazard=null, boost=0.1}={}){
  const q = vectorize(text, RET_IDX, D.ret.idf);
  const res=[];
  KB.forEach((r,i)=>{
    if(place && !(r.place===place || (place==="Opencast" && r.place==="Above Ground"))) return; if(mineType && r.mine_type!==mineType) return;
    let s=0; const d=DOCS[i]; for(const [j,w] of q){ const x=d.get(j); if(x) s+=x*w; }
    if(hazard && r.hazard===hazard) s+=boost;
    res.push({r,score:s});
  });
  return res.sort((a,b)=>b.score-a.score).slice(0,k);
}

const VOCAB = new Set([...D.clf.terms, ...D.ret.terms]);
function stemFix(tok){ if(VOCAB.has(tok)) return tok; for(const suf of ["ing","ed","es","s","er"]){ if(tok.endsWith(suf)){ const b=tok.slice(0,-suf.length); if(VOCAB.has(b)) return b; if(VOCAB.has(b+"e")) return b+"e"; } } return tok; }
function expand(text){
  const low=text.toLowerCase(), words=(low.match(/[\p{L}\p{N}_]+/gu)||[]);
  const add=[]; for(const [re,terms] of PLAIN) if(re.test(low)) add.push(terms);
  const ground=/\b(?:stones?|rocks?|boulders?|patt?h?ar|chattan|walls?|sides?|de+war|di+var|bench\w*|roofs?|chh?a+t|highwall)\b/.test(low);
  const i=add.indexOf("FALL"); if(i>=0) add[i]=ground?"fall of sides parted":"fell";
  if(ground){ for(let j=0;j<words.length;j++) if(/^(?:fall\w*|fell|gir\w*)$/.test(words[j])) words[j]="parted"; }
  // short inputs lean on the dictionary; long sentences mostly speak for themselves
  const fixed=words.map(stemFix).join(" ");
  return words.length>=10 ? `${text} ${add.join(" ")}` : `${fixed} ${fixed} ${add.join(" ")}`;
}

function cut(s,n){ s=s.trim(); if(s.length<=n) return s; const t=s.slice(0,n); return t.slice(0,t.lastIndexOf(" "))+"…"; }
function titleCase(s){ return String(s).toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()); }
function shortMeasure(s){
  s=s.split(/[,;]?\s*(?:as required|as per (?:the )?(?:provision|regulation|reg)|in accordance with (?:the )?(?:provision|regulation|reg)|in compliance|under the provisions?|as stipulated|as laid down|thus (?:not )?negligently|thus not|in contravention|which was required)/i)[0];
  s=s.replace(/^(?:it|it has)\s+been\s+ensured\s+that\s+/i,"Ensure that ").replace(/\s*\(.*?Regulations?.*?\)/g,"").replace(/[\s,;.]+$/,"");
  return cut(s.charAt(0).toUpperCase()+s.slice(1),150);
}
function shortSit(s){
  let t=s.split(/,?\s*(?:due to which|inflicting|causing (?:him|her|them|serious|fatal|grievous)|resulting in|which proved fatal|who succumbed|to which)/i)[0];
  if(t.length<50) t=s;
  t=cut(t.replace(/[\s,;.]+$/,"").replace(/,?\s*thereby$/i,""),190);
  return /[.…]$/.test(t)?t:t+".";
}

function themesOf(m){ m=m.split(/[,;]?\s*(?:as required|under the provisions?|in accordance with the provisions?|thus (?:not )?negligently|in contravention)/i)[0]; const out=[]; for(const [key,re] of THEMES){ if(re.test(m)){ out.push(key); if(out.length===2) break; } } return out; }
function topMeasures(hits, n=5){
  const agg=new Map();
  hits.forEach(({r,score},rank)=>{
    const w=Math.max(score,0.01)*(1-rank*0.08), seen=new Set();
    for(const m of r.measures.split("|").map(x=>x.trim()).filter(Boolean)){
      const ks=themesOf(m); const regs=(m.match(/Reg(?:ulation)?s?\.?\s*(?:No\.?\s*)?\d+(?:\(\w+\))*/gi)||[]).map(x=>"Reg "+x.match(/\d+(?:\(\w+\))*/)[0]).filter(x=>!/^Reg (?:19|20)\d\d$/.test(x));
      for(const k of ks){
        const a=agg.get(k)||{k,w:0,ids:new Set(),regs:new Set()};
        if(!seen.has(k)){ a.w+=w; seen.add(k); }
        a.ids.add(r.id); regs.forEach(x=>a.regs.add(x)); agg.set(k,a);
      }
      if(!ks.length){ const k="x:"+m.slice(0,40); if(!agg.has(k)) agg.set(k,{k,w:w*0.6,ids:new Set([r.id]),regs:new Set(regs),text:shortMeasure(m)}); }
    }
  });
  const T=Object.fromEntries(THEMES.map(([k,,t])=>[k,t]));
  const all=[...agg.values()].sort((a,b)=>b.w-a.w); const strong=all.filter(a=>a.ids.size>=2), weak=all.filter(a=>a.ids.size<2);
  return [...strong,...weak].slice(0,Math.max(3,Math.min(n,strong.length||3))).map(a=>({text:a.text||T[a.k],ids:[...a.ids],regs:[...a.regs].slice(0,3)}));
}

// Why a record was retrieved: the search terms that contributed most to its similarity, plus the hazard bonus if applied
function sharedTerms(qv, i, n=3){
  const d=DOCS[i], out=[];
  for(const [j,w] of qv){ const x=d.get(j); if(x) out.push([D.ret.terms[j], x*w]); }
  out.sort((a,b)=>b[1]-a[1]);
  const picked=[]; for(const [t] of out){ if(picked.some(p=>p.includes(t)||t.includes(p))) continue; picked.push(t); if(picked.length===n) break; }
  return picked;
}

function inFilters(r,place,mt){ return (!place||r.place===place||(place==="Opencast"&&r.place==="Above Ground"))&&(!mt||r.mine_type===mt); }

// Operation A (filter) then Operation B (rank): same score as search(): text similarity + 0.10 if same hazard group
function rankAll(q, place, mt, hazard){
  const qv=vectorize(q, RET_IDX, D.ret.idf), out=[]; let eligible=0;
  KB.forEach((r,i)=>{
    if(!inFilters(r,place,mt)) return;
    eligible++;
    let sim=0; const d=DOCS[i]; for(const [j,w] of qv){ const x=d.get(j); if(x) sim+=x*w; }
    const same=hazard&&r.hazard===hazard;
    if(sim>0||same) out.push({r,sim,same,score:sim+(same?0.1:0)});
  });
  out.sort((a,b)=>b.score-a.score);
  return {qv, eligible, matches:out};
}

// same rule as build_explosion.py evidence()
function xEvidence(text, dgmsHazard){
  const strong=Object.keys(LEX.strong).filter(k=>LEX.strong[k].test(text));
  const weak=Object.keys(LEX.weak).filter(k=>LEX.weak[k].test(text));
  const other=strong.filter(k=>k!=="explosives / blasting");
  const event=LEX.event.test(text);
  const blastingOk=strong.includes("explosives / blasting")&&(event||weak.includes("ignition source")||LEX.groups.has(dgmsHazard));
  const atmo=weak.some(k=>LEX.atmo.has(k))&&weak.some(k=>!LEX.atmo.has(k));
  return {relevant:other.length>0||blastingOk||atmo, strong, weak, event};
}
function xClassify(text){
  const v=vectorize(text, XCLF_IDX, X.clf.idf);
  const z=X.clf.coef.map((row,k)=>{ let s=X.clf.intercept[k]; for(const [j,w] of v) s+=row[j]*w; return s; });
  const mx=Math.max(...z), e=z.map(x=>Math.exp(x-mx)), sum=e.reduce((a,b)=>a+b,0);
  const probs=X.clf.classes.map((c,k)=>({cat:c,p:e[k]/sum,k})).sort((a,b)=>b.p-a.p);
  const top=probs[0], contrib=[];
  for(const [j,w] of v){ const c=X.clf.coef[top.k][j]*w; if(c>0) contrib.push([X.clf.terms[j],c]); }
  contrib.sort((a,b)=>b[1]-a[1]);
  const terms=[]; for(const [t] of contrib){ if(terms.some(p=>p.includes(t)||t.includes(p))) continue; terms.push(t); if(terms.length===5) break; }
  return {probs, top, terms, ambiguous: top.p<0.35 || (top.p-probs[1].p)<0.10};
}

  "Spontaneous Heating, Fire and Explosion Escalation":["Methane / Firedamp Explosion",GASDUST,HYDRO],
  "Metal Mine: Gas, Dust and Other Explosion Mechanisms":["Blasting and Explosives-Related Explosion",HYDRO]};
// SANKET explosion records (coal + non-coal). Narratives carry text and DGMS findings; major-accident list rows carry only a cause label.
const CLOSE={
  "Methane / Firedamp Explosion":[GASDUST,"Combined Methane and Coal-Dust Explosion"],
  "Coal-Dust Explosion":[GASDUST,"Combined Methane and Coal-Dust Explosion"],
  "Combined Methane and Coal-Dust Explosion":[GASDUST,"Coal-Dust Explosion","Methane / Firedamp Explosion"]};
const HREC=X?X.hrec:[];
const HVEC=HREC.map(h=>vectorize([h.situation,h.cause_label,h.reported_cause,h.ignition,h.mineral].join(" "), RET_IDX, D.ret.idf));
function hPlaceOk(h,place){ if(!place) return true; if(!h.place||/not reported/i.test(h.place)) return null; return h.place===place||(place==="Opencast"&&h.place==="Above Ground"); }
function rankHistX(q, place, mt, cat){
  const qv=vectorize(q, RET_IDX, D.ret.idf), out=[]; let eligible=0, unknownPlace=0;
  HREC.forEach((h,i)=>{
    if(mt && h.mine_type!==mt) return;
    const pOk=hPlaceOk(h,place); if(pOk===false) return; if(pOk===null){ if(h.xcat===cat) unknownPlace++; return; }
    eligible++;
    let sim=0; for(const [j,w] of qv){ const x=HVEC[i].get(j); if(x) sim+=x*w; }
    const same=h.xcat===cat, related=!same&&(RELATED[cat]||[]).includes(h.xcat);
    const close=(CLOSE[cat]||[]).includes(h.xcat);
    if(same||(related&&(sim>=0.03||(close&&h.kind==="list")))||sim>=0.15) out.push({h,sim,same,related,score:sim+(same?0.15:related?0.08:0)});
  });
  out.sort((a,b)=>b.score-a.score||(b.h.year||0)-(a.h.year||0));
  return {qv, eligible, unknownPlace, matches:out, nSame:out.filter(m=>m.same).length};
}
function mechCounts(cat){ const c={coal:0,noncoal:0,narr:0,list:0}; HREC.forEach(h=>{ if(h.xcat!==cat) return; h.src.startsWith("Coal")?c.coal++:c.noncoal++; h.kind==="narrative"?c.narr++:c.list++; }); return c; }
// Synthetic scenarios: separate index, ranked by text similarity + 0.10 for the same category, mine-type context only
function synMineOk(ctx, mt){
  if(!mt) return true;
  if(mt==="Coal") return /coal/i.test(ctx);
  if(mt==="Oil & gas") return false;
  return /metal/i.test(ctx);   // Metal ore and Non-metallic ("metalliferous") use the Metal / Coal-or-Metal scenarios
}
function rankSyn(text, mt, cat){
  const qv=vectorize(text, SYN_IDX, X.syn_index.idf), out=[]; let eligible=0;
  X.syn.forEach((s,i)=>{
    if(!synMineOk(s[3],mt)) return;
    eligible++;
    let sim=0; const d=SYN_DOCS[i]; for(const [j,w] of qv){ const x=d.get(j); if(x) sim+=x*w; }
    const same=s[2]===cat;
    if(sim>=0.08||(same&&sim>0)) out.push({s,sim,same,score:sim+(same?0.1:0)});
  });
  out.sort((a,b)=>b.score-a.score);
  return {eligible, matches:out};
}

const BOOK_SHORT={Ramlu:"Ramlu, Mine Disasters and Mine Rescue",Cheng:"Cheng, Explosions in Underground Coal Mines"};
// DGMS finding themes that a displayed book measure already covers
const THEME_TO_G={gas:["G01","G04","G11"],electric:["G06"],phone:["G05"]};
function gStatus(g){
  const stating=[...new Set(g.refs.filter(r=>r.support==="states").map(r=>r.book))];
  const book= stating.length===2?"Stated in both books":stating.length===1?`Stated in ${stating[0]}`:"Derived from a case in the book";
  const overall= stating.length||g.links.length? "Directly supported by source" : g.refs.length? "Derived from multiple sources" : "Insufficient evidence";
  return {book, overall};
}
function pickGuidance(cat, text, topIds, mt){
  const rel=RELATED[cat]||[], ctxText=text+" "+(mt||"");
  const score=g=>{ const own=g.mechanisms.includes(cat)?2:g.mechanisms.some(m=>rel.includes(m))?0.7:0; if(!own) return 0;
    const kw=g.keywords&&new RegExp(g.keywords,"i").test(text)?1:0, here=g.links.filter(l=>topIds.has(l[0])).length;
    return own+kw+here*1.5+g.links.length*0.3+g.refs.filter(r=>r.support==="states").length*0.2; };
  return X.guidance.filter(g=>!g.context||new RegExp("\\b(?:"+g.context+")","i").test(ctxText)).map(g=>({g,s:score(g)})).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.g);
}
function guidanceCard(g, i, cat, topIds){
  const st=gStatus(g), mc=mechCounts(cat), byId=Object.fromEntries(HREC.map(h=>[h.id,h]));
  const linksHere=g.links.filter(l=>topIds.has(l[0]));
  return `<li class="act card gcard"><span class="num" aria-hidden="true">${i+1}</span>
    <div class="t">${esc(g.measure)}
      <div class="gtags"><span class="prov ok">${esc(st.overall)}</span><span class="prov src">${esc(st.book)}</span>
        <span class="prov ${g.links.length?"hist":"cat"}">${g.links.length?`${g.links.length} DGMS accident${g.links.length>1?"s":""} support this`:"No DGMS finding states this"}</span></div></div>
    <details class="ev"><summary>Evidence and references</summary>
      <div class="gev">
        <p class="glabel">Mechanisms addressed</p><p>${g.mechanisms.map(esc).join(" · ")}</p>
        <p class="glabel">Reference-book guidance</p>
        <ul>${g.refs.map(r=>`<li><b>${esc(BOOK_SHORT[r.book])}</b>, §${esc(r.section)}, p.${esc(r.pages)}. <i>${r.support==="states"?"The book states this measure.":"The book describes a case; the measure is derived from it."}</i><br>${esc(r.note)}</li>`).join("")}</ul>
        ${g.conflict?`<p class="glabel">Where the books differ</p><p>${esc(g.conflict)}</p>`:""}
        <p class="glabel">Historical evidence (DGMS SANKET findings)</p>
        ${g.links.length?`<ul>${g.links.map(([id,f])=>{ const h=byId[id]; return `<li><b>${esc(id)}</b>${h?` (${esc(h.dgms_id)}), ${esc(titleCase(h.mine))} ${esc(String(h.year))}, ${esc(h.src)}`:""}${linksHere.some(l=>l[0]===id)?" · <i>in the results below</i>":""}<br>DGMS finding: the accident could have been averted had ${esc(f)}</li>`; }).join("")}</ul>`
                        :`<p>No DGMS finding in the SANKET explosion records states this measure.</p>`}
        <p>${mc.coal+mc.noncoal} SANKET accident${mc.coal+mc.noncoal===1?"":"s"} of the predicted mechanism (${mc.coal} coal, ${mc.noncoal} non-coal; ${mc.list} with a cause label only).</p>
        <p class="interp">The measure text is a summary written for this app, not a quotation from either book or from DGMS.</p>
      </div></details></li>`;
}
function xMeasuresBlock(cat, text, top, mt){
  const topIds=new Set(top.map(m=>m.h.id));
  const gs=pickGuidance(cat, text, topIds, mt), shownG=new Set(gs.map(g=>g.id));
  // DGMS finding themes from the closest historical records that the book measures do not already cover
  const narr=top.filter(m=>m.h.findings&&m.h.findings.length).map(m=>({r:{id:m.h.id,measures:m.h.findings.join(" | ")},score:m.score}));
  const tms=narr.length?topMeasures(narr):[];
  const dgmsOnly=tms.filter(m=>{ const k=(THEMES.find(([k,,t])=>t===m.text)||[])[0]; return !(THEME_TO_G[k]||[]).some(id=>shownG.has(id)); });
  // one list, ordered by how many of the matched historical accidents support each measure (book measures first on ties)
  const items=[...gs.map(g=>({kind:"g",g,here:g.links.filter(l=>topIds.has(l[0])).length})),...dgmsOnly.map(m=>({kind:"d",m,here:m.ids.length}))]
    .sort((a,b)=>b.here-a.here||(a.kind==="g"?-1:1)-(b.kind==="g"?-1:1));
  const html=items.map((it,i)=>it.kind==="g"?guidanceCard(it.g,i,cat,topIds):dgmsCard(it.m,i)).join("");

  function dgmsCard(m,i){ return `<li class="act card"><span class="num" aria-hidden="true">${i+1}</span><div class="t">${esc(m.text)}

      <div class="sec-h"><h2>More recommendations</h2></div>

      <div class="advice-body" id="advBody"></div>

const PAGERS={};

function renderPager(id, scroll){
  const P=PAGERS[id], n=P.items.length, start=P.page*PAGE, end=Math.min(start+PAGE,n);

  const nav=$(id+"-pager"), atEnd=end>=n;
  nav.hidden=n<=PAGE;
  nav.innerHTML=`<button type="button" class="btn2" data-dir="-1" ${start===0?"disabled":""}>Previous 6</button>
    <span class="pg">${atEnd&&n>PAGE?"You have reached the end of the matching records.":""}</span>
    <button type="button" class="btn2" data-dir="1" ${atEnd?"disabled":""}>Next 6 records</button>`;
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{ P.page+=Number(b.dataset.dir); renderPager(id,true); });

      </div>
      <div class="alts"><span class="label">Hazard ranking</span>
        ${probs.slice(0,4).map((c,i)=>`<div class="bar ${i===0?"top":""}"><span>${esc(c.hazard)}</span><span class="p">${pct(c.p)}%</span><div class="track"><div class="fill" data-w="${(c.p*100).toFixed(1)}"></div></div></div>`).join("")}
      </div>
    </div>`;
}

function explosionPanel(xa, pct){
  const {cls,ev,ctx,nHist,nSyn}=xa, t=cls.top;
  const coalOnly=X.coal_only.includes(t.cat)&&ctx.metal;
  const feats=[...ev.strong,...ev.weak];
  return `
    <div class="xpanel card reveal" role="group" aria-label="Explosion analysis">
      <div class="xp-h"><span class="label">Explosion analysis</span>${ev.event?"":TAG_POT}</div>
      <div class="xp-grid">
        <div class="xp-main">
          <h2 class="xp-cat">${cls.ambiguous?`Ambiguous: ${esc(t.cat)} or ${esc(cls.probs[1].cat)}`:esc(t.cat)}</h2>
          <div class="score"><span class="v">${pct(t.p)}%</span><span class="k">explosion-category confidence</span><span class="badge ${cls.ambiguous?"lo":confClass(t.p)}"><i aria-hidden="true"></i>${cls.ambiguous?"Uncertain":interp(t.p)}</span></div>
          <p class="interp">From a classifier trained on ${X.metrics.n_train} examples: ${X.syn.length} synthetic scenarios (labels not yet expert-validated) and ${X.metrics.n_train-X.syn.length} historical DGMS explosion narratives. It says which explosion mechanism your description resembles, not the chance of an explosion.${coalOnly?` <b>Note:</b> this category was defined for coal mines, but the mine context is metal / non-coal. Check the description.`:""}</p>
          <dl class="kv xkv">
            <dt>Explosion evidence</dt><dd>${feats.map(f=>`<span class="pill">${esc(f)}</span>`).join(" ")}</dd>
            <dt>Words behind the category</dt><dd>${cls.terms.length?cls.terms.map(esc).join(", "):"none specific"}</dd>
            <dt>Mine context</dt><dd>${esc(ctx.label)}</dd>
            <dt>Records found</dt><dd>${nHist} historical SANKET explosion record${nHist===1?"":"s"} (${xa.hist.matches.filter(m=>m.h.src.startsWith("Coal")).length} coal, ${xa.hist.matches.filter(m=>!m.h.src.startsWith("Coal")).length} non-coal) · ${nSyn} synthetic scenario${nSyn===1?"":"s"}</dd>
          </dl>
        </div>
        <div class="alts"><span class="label">Explosion categories</span>
          ${cls.probs.slice(0,4).map((c,i)=>`<div class="bar ${i===0&&!cls.ambiguous?"top":""}"><span>${esc(c.cat)}</span><span class="p">${pct(c.p)}%</span><div class="track"><div class="fill" data-w="${(c.p*100).toFixed(1)}"></div></div></div>`).join("")}

        </div>
      </div>
    </div>`;
}

function measuresHTMLBlock(top, note){
  const acts=top.length?topMeasures(top).map((m,i)=>`
    <li class="act card"><span class="num" aria-hidden="true">${i+1}</span><span class="t">${esc(m.text)}</span>
      <details class="ev"><summary>Based on ${m.ids.length} historical accident${m.ids.length>1?"s":""}</summary><p>${m.ids.map(esc).join(", ")}${m.regs.length?" · "+m.regs.map(esc).join(", "):""}</p></details></li>`).join(""):"";
  return `
    <div class="block reveal">
      <div class="sec-h"><h2>Preventive measures</h2><span class="sub">${top.length?`From the ${top.length} closest historical accident${top.length===1?"":"s"}`:"No historical evidence"}</span></div>
      ${note||""}
      ${acts?`<ol class="acts">${acts}</ol>`:""}
    </div>
    ${top.length?`<div class="advice card reveal" id="adv" hidden>
      <div class="sec-h"><h2>More recommendations</h2></div>
      <p class="why">Claude suggests measures not already listed above, using the DGMS findings of the ${top.length} closest historical accidents and the job you described. These are AI suggestions, not DGMS findings.</p>
      <div class="advice-body" id="advBody"></div>
      <div class="btns"><button type="button" class="btn2" id="advGo">Get more recommendations</button><button type="button" class="btn2" id="advStop" hidden>Stop</button></div>
      <p class="note" id="advNote"></p>
    </div>`:""}`;
}

function run(opts={}){
  const text=$("q").value.trim(), place=opts.relaxed?"":$("place").value, mt=opts.relaxed?"":$("mt").value;
  const fromPlace=$("place").value, fromMt=$("mt").value;
  const out=$("out"), pct=p=>(p*100).toFixed(0);
  const browse=text.length<2;
  if(browse && !place && !mt){ out.innerHTML=(X?"":xErrHTML())+`<div class="empty card reveal">${icon("Other causes")}<p><b>Nothing to analyse yet.</b> Type the job you are going to do (for example: blasting, truck, roof, wire, water), or choose a place of work or mine type to browse records.</p></div>`; $("q").focus(); return; }

  let probs=null, hz=null, unclear=false, q="", xa=null;
  if(!browse){
    q=expand(text);
    const known=vectorize(q,CLF_IDX,D.clf.idf).size+vectorize(q,RET_IDX,D.ret.idf).size+(X?vectorize(text,XCLF_IDX,X.clf.idf).size:0);
    if(known===0){ out.innerHTML=`<div class="empty card reveal">${icon("Other causes")}<p><b>These words are not in the DGMS records.</b> The model could not recognise “${esc(text.slice(0,60))}”. Describe the activity, equipment or place, for example: drilling, truck, roof, conveyor, wire, water, phone.</p></div>`; last=null; return; }
    probs=classify(q); hz=probs[0]; unclear=hz.p<0.2;
    if(X && !opts.noExplosion){
      const ev=xEvidence(text, hz.hazard);
      if(ev.relevant){
        const cls=xClassify(text), ctx=mineContext(text, mt);
        const hist=rankHistX(q, place, mt, cls.top.cat), syn=rankSyn(text, mt, cls.top.cat);
        xa={ev,cls,ctx,hist,syn,nHist:hist.matches.length,nSyn:syn.matches.length};
      }
    }
  }

  const relaxedNote=opts.relaxed?`<div class="notice reveal"><b>Broadened search.</b> Your filters (${esc(filtersText(fromPlace,fromMt))}) returned no relevant historical records, so these results come from all places of work and mine types.</div>`:"";
  const allNote=opts.noExplosion?`<div class="notice reveal"><b>All DGMS accidents.</b> Explosion analysis is switched off for this search, so results include every relevant accident type, not only explosions.</div>`:"";

  if(xa){
    // ----- explosion mode -----
    const top=xa.hist.matches.slice(0,PAGE);
    last={text,place,mt,probs,hits:top.map(m=>({r:{id:m.h.id,year:m.h.year,place:m.h.place,mine_type:m.h.mine_type,mineral:m.h.mineral,cause_group:m.h.xcat,cause_subgroup:m.h.cause_label,situation:m.h.situation||("Cause label only: "+m.h.cause_label),measures:(m.h.findings||[]).join(" | "),regulations:m.h.regulations||"none recorded"}})),unclear,xcat:xa.cls.top.cat};
    const histBlock = xa.hist.matches.length ? listBlock("hx","Historical explosion records (DGMS SANKET)", (xa.hist.unknownPlace?`<p class="partial">${xa.hist.unknownPlace} more SANKET record${xa.hist.unknownPlace===1?"":"s"} of this category ${xa.hist.unknownPlace===1?"has":"have"} no recorded place of work and ${xa.hist.unknownPlace===1?"is":"are"} left out by the place filter. Set Place of work to Any to include ${xa.hist.unknownPlace===1?"it":"them"}.</p>`:"")+(xa.hist.nSame===0?`<p class="partial"><b>No historical DGMS record of the category “${esc(xa.cls.top.cat)}”.</b> The records below involve a related mechanism or share strong wording; they are context, not direct precedents.</p>`:"")+`<button type="button" class="linkbtn" id="allacc">Show all DGMS accidents, not only explosions</button>`) :
      `<div class="block"><div class="sec-h reveal"><h2>Historical explosion records</h2><span class="sub">None found</span></div>
        <div class="empty card reveal">${icon("Explosives")}<div><p><b>No suitable historical explosion records under the current filters</b> (${esc(filtersText(place,mt))}). ${xa.hist.eligible===0?`None of the ${HREC.length} SANKET explosion records fall under these filters.${xa.hist.unknownPlace?` ${xa.hist.unknownPlace} record(s) of this category have no recorded place of work; set Place of work to Any to include them.`:""}`:`The DGMS data has ${xa.hist.eligible} explosion record${xa.hist.eligible===1?"":"s"} under these filters, but none match “${esc(xa.cls.top.cat)}” or your wording.`} Synthetic scenarios are listed separately below.</p>
        <div class="btns" style="margin-top:12px">${place||mt?`<button type="button" class="btn2" id="broaden">Search all places and mine types</button>`:""}<button type="button" class="btn2" id="allacc">Search all DGMS accidents</button></div></div></div></div>`;
    const synBlock = xa.syn.matches.length ? listBlock("sx","Synthetic training scenarios", `<p class="partial">Generated examples from ${esc(X.source)}. They are <b>not</b> DGMS accidents, did not happen, and are never counted as evidence. Place-of-work filters are not applied to them because their work-area context is broad.</p>`) :
      `<div class="block"><div class="sec-h reveal"><h2>Synthetic training scenarios</h2><span class="sub">None found</span></div><p class="partial">No synthetic scenario matches this description${mt?` for ${esc(mtLabel(mt))}`:""}.</p></div>`;
    out.innerHTML = relaxedNote + hazardPanel(hz,probs,unclear,pct) + explosionPanel(xa,pct) + xMeasuresBlock(xa.cls.top.cat, text, top, mt) + histBlock + synBlock;
    if(xa.hist.matches.length) makePager("hx", xa.hist.matches, m=>xCaseHTML(m,xa.hist.qv), "historical explosion records", `(from ${xa.hist.eligible} SANKET explosion records ${place||mt?"in these filters":"(coal and non-coal)"})`);
    if(xa.syn.matches.length) makePager("sx", xa.syn.matches, synHTML, "synthetic scenarios", `(from ${xa.syn.eligible}${mt?` for ${mtLabel(mt)}`:""})`);
  } else {
    // ----- general mode (unchanged behaviour) -----
    let res;
    if(browse) res=browseAll(place,mt); else res=rankAll(q,place,mt,unclear?null:hz.hazard);
    const top=res.matches.slice(0,PAGE);
    last={text,place,mt,probs,hits:top,unclear};
    const hazardHTML = browse ? `<div class="notice reveal"><b>Browsing ${res.eligible} record${res.eligible===1?"":"s"}</b> for ${esc(filtersText(place,mt))}, newest first. Add a situation description to get the likely hazard, preventive measures and relevance ranking.</div>` : hazardPanel(hz,probs,unclear,pct);
    const measuresBlock = (!browse && top.length) ? measuresHTMLBlock(top,"") : "";
    const accBlock = res.matches.length ? listBlock("acc", browse?"Accident records":"Closest past accidents", !browse && res.matches.length<PAGE?`<p class="partial">Only ${res.matches.length} record${res.matches.length===1?"":"s"} in these filters relate to your description.</p>`:"")
                                        : noMatchHTML(place,mt,browse,res.eligible,unclear);
    out.innerHTML = (X?"":xErrHTML()) + relaxedNote + allNote + hazardHTML + measuresBlock + accBlock;
    if(res.matches.length) makePager("acc", res.matches, m=>caseHTML(m,res.qv||null,false), browse?"records":"matching records",
      browse?"":`(from ${res.eligible} ${opts.relaxed||(!place&&!mt)?"records in the full dataset":"records in these filters"})`);
  }
  const b=$("broaden"); if(b) b.onclick=()=>run({relaxed:true, noExplosion:opts.noExplosion});
  const a=$("allacc"); if(a) a.onclick=()=>run({noExplosion:true, relaxed:opts.relaxed});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ out.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w+"%"; }); }));
  wireAdvice();
}

let sample=null;
function wireAdvice(){
  const box=$("adv"); if(!box) return;
  box.hidden=!sample || !last.hits.length;
  $("advGo").onclick=askClaude; $("advStop").onclick=()=>ctl?.abort();
}
function buildPrompt(){
  const shown=topMeasures(last.hits).map((m,i)=>`${i+1}. ${m.text}`).join("\n");
  const recs=last.hits.map(({r})=>`[${r.id}] ${r.year}, ${r.place}, ${r.mine_type}, ${r.mineral}. Cause: ${r.cause_group} / ${r.cause_subgroup}.
What happened: ${r.situation}
DGMS: the accident could have been averted had ${r.measures.split("|").map(s=>s.trim()).join("; had ")}
Regulations: ${r.regulations}`).join("\n\n");
  return `You are a mine-safety assistant for Indian mines, writing for a miner in simple English.

The miner's job: ${last.text}
Place: ${last.place||"not stated"} | Mine type: ${last.mt||"not stated"}
${last.xcat?`Explosion category (classifier trained on synthetic scenarios): ${last.xcat}\n`:""}Likely hazard: ${last.unclear?"unclear (top guesses: "+last.probs.slice(0,3).map(p=>p.hazard).join(", ")+")":last.probs[0].hazard}

The miner has ALREADY been shown these preventive measures:
${shown}

Your task: give 5 to 7 OTHER preventive measures for this job that are NOT in the list above. Do not repeat or reword any of them, and do not give general advice that one of them already covers (for example, if supervision is listed, do not suggest supervision again).

Draw first on the past DGMS fatal-accident findings below, picking findings the list above does not cover. Then you may add practical steps specific to this job (checks before starting, what to watch for while working, when to stop and tell the supervisor).

Past accidents:
${recs}

Format: plain text, a numbered list only, one short sentence per point in simple words, no headings, no bold, no record ids, no regulation numbers, no introduction and no closing line.`;
}
async function askClaude(){
  const go=$("advGo"), stop=$("advStop"), body=$("advBody"), note=$("advNote");
  ctl=new AbortController(); go.disabled=true; stop.hidden=false; body.textContent="Thinking…";
  try{
    const {truncated}=await sample(buildPrompt(),{cache:false,signal:ctl.signal,onText:({text})=>{body.textContent=text;}});
    note.textContent=truncated?"The answer was cut short. Try a shorter situation.":"";
    go.textContent="Get different recommendations";
  }catch(e){
    body.textContent=e.text??"";
    const msg={not_granted:"Claude access was not allowed for this page.",sampling_disabled:"Claude is not available for this account.",rate_limited:"Too many requests just now. Try again in a minute.",session_expired:"Sign in to Claude again, then retry.",refused:"Claude declined this request. Rephrase the situation."}[e.code];
    if(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared"){ $("adv").hidden=true; sample=null; }
    else if(e.code!=="cancelled") note.textContent=msg||"The request failed. Try again.";
  }finally{ go.disabled=false; stop.hidden=true; }
}

$("f").addEventListener("submit",e=>{e.preventDefault();submit();});
$("q").value=""; $("place").value=""; $("mt").value="";
idle();
(async()=>{ try{ sample=await window.claude?.use?.("sample"); }catch{ sample=null; } if(last) wireAdvice(); })();
</script>
