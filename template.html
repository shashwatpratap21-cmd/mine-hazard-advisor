<meta charset="utf-8">
<title>Mine Hazard Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mine Hazard Advisor: restrained industrial console. 30% input / 70% evidence.
   Single dark theme by design; every colour defined here. */
:root{
  color-scheme:dark;
  --bg:#090C0F; --surface:#10161B; --surface-2:#141B21; --inset:#0B1014;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#EEF2F5; --text-2:#A3AFB8; --text-3:#76838D;
  --silver:#C9D2D8;
  --amber:#F2B544; --amber-hi:#FFD27A; --amber-ink:#1C1305; --amber-a:rgba(242,181,68,.12);
  --red:#F2665F; --red-a:rgba(242,102,95,.12);
  --steel:#6F8794;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 14px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -200px,rgba(160,180,195,.06),transparent 70%);
  color:var(--text);font:17px/1.6 var(--body);padding-inline:24px;padding-block:0 72px}
@media (max-width:600px){body{padding-inline:16px;font-size:16px}}
.wrap{max-width:1320px;margin:0 auto}
:focus-visible{outline:2px solid var(--amber-hi);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:14px;padding-block:28px 22px;border-bottom:1px solid var(--line)}
.emblem{width:40px;height:40px;flex:none}
h1{font:700 clamp(1.7rem,3vw,2.15rem)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--silver)}
.tag{margin:4px 0 0;color:var(--text-3);font-size:.92rem}

/* layout */
main{display:grid;grid-template-columns:minmax(300px,3fr) minmax(0,7fr);gap:36px;margin-top:36px;align-items:start}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr);gap:28px;margin-top:28px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.label{font:600 .78rem/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* input console */
form{padding:24px;display:grid;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
@media (max-width:980px){form{position:static}}
.form-h{font:700 1.3rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);margin:0}
.field{display:grid;gap:8px}
textarea,select{font:inherit;font-size:1rem;color:var(--text);background:var(--inset);border:1px solid var(--line-2);border-radius:var(--r-sm);width:100%;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);transition:border-color .15s,box-shadow .15s}
textarea{min-height:150px;resize:vertical;line-height:1.55;padding:14px 16px;caret-color:var(--amber)}
textarea::placeholder{color:var(--text-3)}
select{appearance:none;-webkit-appearance:none;padding:11px 36px 11px 14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--surface);color:var(--text)}
textarea:hover,select:hover{border-color:rgba(255,255,255,.2)}
textarea:focus,select:focus{outline:none;border-color:rgba(242,181,68,.7);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(242,181,68,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.chips{display:grid;gap:6px}
.chip{font:400 .9rem/1.35 var(--body);color:var(--text-2);background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text);border-color:rgba(242,181,68,.55);background:var(--amber-a);box-shadow:inset 3px 0 0 var(--amber)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;font:700 1.15rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink);
  border:1px solid #9A6B17;border-radius:var(--r-sm);padding:15px 18px;cursor:pointer;
  background:linear-gradient(180deg,var(--amber-hi) 0%,var(--amber) 55%,#DB9C2C 100%);
  box-shadow:inset 0 1px 0 rgba(255,245,220,.7),0 6px 16px -8px rgba(242,181,68,.55);transition:filter .15s,transform .08s,box-shadow .15s}
.go:hover{filter:brightness(1.05)}
.go:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(90,55,5,.4)}
.go[disabled]{filter:saturate(.7) brightness(.9);cursor:progress}
.go .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(28,19,5,.3);border-top-color:var(--amber-ink);display:none}
.go.busy .spin{display:inline-block}
@media (prefers-reduced-motion:no-preference){.go.busy .spin{animation:spin .7s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* results */
section.out{display:grid;gap:40px;min-width:0}
.block{display:grid;gap:16px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.sec-h h2{font:700 1.55rem/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--text)}
.sec-h .sub{font-size:.92rem;color:var(--text-3)}

/* hazard panel */
.hazard{padding:28px 30px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;
  border-color:rgba(242,181,68,.35);background:linear-gradient(180deg,#141B20,#0F1418);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 3px 0 -1px rgba(242,181,68,.55),0 2px 18px rgba(0,0,0,.35)}
@media (max-width:720px){.hazard{grid-template-columns:minmax(0,1fr);gap:26px;padding:22px}}
.hz-main{display:grid;gap:14px;align-content:start;min-width:0}
.hz-title{display:flex;align-items:center;gap:16px;min-width:0}
.hz-icon{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--amber);background:var(--amber-a);border:1px solid rgba(242,181,68,.3)}
.hz-icon svg{width:28px;height:28px}
.hz-name{font:700 clamp(2rem,3.4vw,2.7rem)/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;color:#fff;min-width:0;overflow-wrap:break-word}
.hz-name.long{font-size:clamp(1.6rem,2.6vw,2.1rem)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .v{font:500 1.6rem/1 var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.score .k{font-size:.95rem;color:var(--text-2)}
.badge{display:inline-flex;align-items:center;gap:7px;font:600 .82rem/1 var(--body);letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.hi{color:var(--amber-hi);border-color:rgba(242,181,68,.45);background:var(--amber-a)}
.badge.mid{color:#E2D2AE;border-color:rgba(226,210,174,.3);background:rgba(226,210,174,.06)}
.badge.lo{color:var(--text-2);border-color:var(--line-2);background:rgba(255,255,255,.03)}
.gauge{height:8px;border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.gauge b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#C88A22,var(--amber-hi))}
.interp{margin:0;font-size:.9rem;color:var(--text-3)}
.alts{display:grid;gap:14px;align-content:start;min-width:0;padding-left:30px;border-left:1px solid var(--line)}
@media (max-width:720px){.alts{padding-left:0;border-left:0;padding-top:22px;border-top:1px solid var(--line)}}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.98rem;color:var(--text-2)}
.bar .p{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2)}
.bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--inset);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:3px;background:var(--steel)}
.bar.top{color:var(--text);font-weight:600} .bar.top .p{color:var(--amber-hi)}
.bar.top .fill{background:linear-gradient(90deg,#C88A22,var(--amber-hi))}
@media (prefers-reduced-motion:no-preference){.bar .fill,.gauge b{transition:width .6s cubic-bezier(.2,.8,.2,1)}}

/* preventive measures */
.acts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.act{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 16px;padding:18px 22px}
.act .num{grid-row:1/3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 .95rem/1 var(--mono);color:var(--text-2);border:1px solid var(--line-2);background:var(--inset)}
.act .t{font-size:1.04rem;line-height:1.55;color:var(--text);max-width:68ch}
.act:first-child{border-color:rgba(242,181,68,.35)}
.act:first-child .num{color:var(--amber-ink);background:var(--amber);border-color:var(--amber)}
.ev{font-size:.88rem;color:var(--text-3)}
.ev summary{cursor:pointer;width:fit-content}
.ev summary:hover{color:var(--text-2)}
.ev p{margin:6px 0 0;font-family:var(--mono);font-size:.84rem;color:var(--text-2)}

/* advisory */
.advice{padding:24px 26px;display:grid;gap:14px}
.advice .why{margin:0;color:var(--text-2);max-width:70ch}
.advice-body{white-space:pre-wrap;max-width:72ch;padding:16px 18px;border-radius:var(--r-sm);background:var(--inset);border:1px solid var(--line)}
.advice-body:empty{display:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn2{font:600 1rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--text);cursor:pointer;padding:12px 18px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface-2);transition:border-color .15s,background .15s}
.btn2:hover{border-color:rgba(242,181,68,.5);background:#182027}
.btn2[disabled]{opacity:.5;cursor:default}
.note{font-size:.9rem;color:var(--text-2);margin:0}
.note:empty{display:none}

/* accident cards */
.cases{display:grid;gap:14px}
.case{padding:22px 26px;display:grid;gap:14px;min-width:0}
.case-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.mine{font:600 1.18rem/1.3 var(--body);color:var(--text);margin:0}
.yr{font:500 .98rem var(--mono);color:var(--text-2)}
.killed{margin-left:auto;font:600 .88rem/1 var(--body);color:var(--red);background:var(--red-a);border:1px solid rgba(242,102,95,.35);padding:6px 10px;border-radius:999px;white-space:nowrap}
.sit{margin:0;color:#D5DDE2;max-width:74ch}
.findings{display:grid;gap:8px}
.findings h4{margin:0;font:600 .78rem/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.lessons{margin:0;padding:0 0 0 18px;display:grid;gap:6px;color:var(--text);max-width:74ch}
.lessons li::marker{color:var(--amber)}
.src{font:400 .86rem/1.5 var(--mono);color:var(--text-3)}
.src b{color:var(--text-2);font-weight:500}
details.more summary{cursor:pointer;width:fit-content;font:600 .9rem/1 var(--body);color:var(--text-2);padding:2px 0}
details.more summary:hover{color:var(--text)}
.full{display:grid;gap:12px;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--text-3)} .kv dd{margin:0;color:var(--text-2);min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr);gap:0}.kv dd{margin-bottom:8px}}
.measures{margin:0;padding:0 0 0 18px;display:grid;gap:8px;color:var(--text-2);max-width:78ch;font-size:.95rem}
.measures li::marker{color:var(--text-3)}
.measures em{font-style:normal;font-weight:600;color:var(--text)}

.empty{display:flex;gap:16px;align-items:center;padding:26px 28px;color:var(--text-2)}
.empty svg{width:34px;height:34px;flex:none;color:var(--amber)}
.empty p{margin:0;max-width:62ch} .empty b{color:var(--text)}
@media (prefers-reduced-motion:no-preference){.reveal{animation:rise .35s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<div class="wrap">
<header>
  <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="emT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D2D8"/><stop offset=".5" stop-color="#5E6C75"/><stop offset="1" stop-color="#9AA7AF"/></linearGradient></defs>
    <polygon points="20,1.5 37,11 37,29 20,38.5 3,29 3,11" fill="#141B20" stroke="url(#emT)" stroke-width="1.5"/>
    <path d="M20 11 L29 27 H11 Z" fill="#F2B544"/>
    <path d="M20 16.5 V21.5" stroke="#1C1305" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="24.2" r="1.2" fill="#1C1305"/>
  </svg>
  <div>
    <h1>Mine Hazard Advisor</h1>
    <p class="tag">Evidence-backed mining hazard intelligence.</p>
  </div>
</header>

<main>
  <form id="f" class="card" autocomplete="off" aria-label="Describe the job">
    <p class="form-h">Describe the job</p>
    <div class="field">
      <label class="label" for="q">Situation</label>
      <textarea id="q" placeholder="e.g. charging holes with explosives on a bench, or just: truck, roof, wire, water"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label class="label" for="place">Place of work</label>
        <select id="place"><option value="">Any</option></select></div>
      <div class="field"><label class="label" for="mt">Mine type</label>
        <select id="mt"><option value="">Any</option></select></div>
    </div>
    <div class="field">
      <span class="label" id="exl">Examples</span>
      <div class="chips" id="ex" role="group" aria-labelledby="exl"></div>
    </div>
    <button class="go" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span id="goT">Find precedents</span></button>
  </form>

  <section class="out" id="out" aria-live="polite"></section>
</main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const STOP = new Set(D.stop);
const KB = D.kb.map(r => Object.fromEntries(D.kbcols.map((c,i)=>[c,r[i]])));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// sklearn TfidfVectorizer: lowercase, token_pattern \b\w\w+\b, english stop words, ngram (1,2), sublinear tf, l2
function index(terms){ const m=new Map(); terms.forEach((t,i)=>m.set(t,i)); return m; }
const CLF_IDX = index(D.clf.terms), RET_IDX = index(D.ret.terms);
function vectorize(text, idx, idf){
  const toks = (text.toLowerCase().match(/[\p{L}\p{N}_]{2,}/gu) || []).filter(t=>!STOP.has(t));
  const grams = toks.slice(); for(let i=0;i<toks.length-1;i++) grams.push(toks[i]+" "+toks[i+1]);
  const tf = new Map(); for(const g of grams){ const j=idx.get(g); if(j!==undefined) tf.set(j,(tf.get(j)||0)+1); }
  let norm=0; const v=new Map();
  for(const [j,c] of tf){ const w=(1+Math.log(c))*idf[j]; v.set(j,w); norm+=w*w; }
  norm=Math.sqrt(norm)||1; for(const [j,w] of v) v.set(j,w/norm);
  return v;
}
function classify(text){
  const v = vectorize(text, CLF_IDX, D.clf.idf);
  const z = D.clf.coef.map((row,k)=>{ let s=D.clf.intercept[k]; for(const [j,w] of v) s+=row[j]*w; return s; });
  const mx=Math.max(...z), e=z.map(x=>Math.exp(x-mx)), sum=e.reduce((a,b)=>a+b,0);
  return D.clf.classes.map((c,k)=>({hazard:c,p:e[k]/sum})).sort((a,b)=>b.p-a.p);
}
const DOCS = D.ret.docs.map(([ix,vals])=>{ const m=new Map(); ix.forEach((j,i)=>m.set(j,vals[i])); return m; });
function search(text, {k=6, place="", mineType="", hazard=null, boost=0.1}={}){
  const q = vectorize(text, RET_IDX, D.ret.idf);
  const res=[];
  KB.forEach((r,i)=>{
    if(place && !(r.place===place || (place==="Opencast" && r.place==="Above Ground"))) return; if(mineType && r.mine_type!==mineType) return;
    let s=0; const d=DOCS[i]; for(const [j,w] of q){ const x=d.get(j); if(x) s+=x*w; }
    if(hazard && r.hazard===hazard) s+=boost;
    res.push({r,score:s});
  });
  return res.sort((a,b)=>b.score-a.score).slice(0,k);
}

// Plain / Hindi words -> DGMS vocabulary, so short inputs still find good matches
const PLAIN = [
  [/\b(?:blast\w*|shot ?fir\w*|explosives?|barood|baarood|visphot|dhamaka|blasting)\b/, "blasting explosives shot holes charged holes detonator blaster shelter danger zone"],
  [/\b(?:drill\w*|jack ?hammer|chhed|ched)\b/, "drilling holes jack hammer drill misfire socket charged hole"],
  [/\b(?:misfire\w*|sockets?)\b/, "misfire socket charged hole drilling"],
  [/\b(?:trucks?|lorr(?:y|ies)|dumpers?|tippers?|haulers?|hywa|hyva|vehicles?|ga+di|ga+ri)\b/, "tipper dumper truck haul road driver vehicle"],
  [/\b(?:driv\w*|chala\w*)\b/, "driver tipper dumper vehicle haul road"],
  [/\b(?:roads?|sa?dak|rasta)\b/, "haul road tipper dumper"],
  [/\b(?:revers\w*|back ?gear|peeche)\b/, "reverse reversing dumper tipper"],
  [/\b(?:belts?|conveyors?|patta)\b/, "belt conveyor pulley drum"],
  [/\b(?:cage|shaft|winding|lift|skip)\b/, "cage shaft winding skip"],
  [/\b(?:roofs?|chh?a+t|chhath|chocks?|goaf|depillaring|supports?|bolt\w*)\b/, "roof fall of roof roof support gallery"],
  [/\b(?:walls?|sides?|de+war|di+var|diwar|deewar)\b/, "sides fall of sides bench highwall loose parted mass"],
  [/\b(?:stones?|rocks?|boulders?|patt?h?ar|pathar|chattan)\b/, "stone boulder loose parted mass fall of sides sides"],
  [/\b(?:fall\w*|fell|gir\w*)\b/, "FALL"],
  [/\b(?:bench\w*|pits?|khadan|quarr(?:y|ies)|mine face)\b/, "bench highwall sides loose fall of sides opencast quarry slope"],
  [/\b(?:dump\w*)\b/, "dump edge dumper tipper"],
  [/\b(?:wires?|ta+r|cables?)\b/, "electric cable live shock"],
  [/\b(?:current|kar[ae]nt|shock|jhatka)\b/, "electric shock live"],
  [/\b(?:bijli|light|lights|lamp|switch\w*|transformer|fuse|electrician\w*|kv|joint|earthing)\b/, "electric electrical cable switch live shock"],
  [/\b(?:ladders?|s[ie]+dhi)\b/, "ladder fell height slipped"],
  [/\b(?:heights?|upar|climb\w*|roof top|gantry|scaffold\w*)\b/, "height fell from height slipped platform"],
  [/\b(?:slip\w*|fisal\w*)\b/, "slipped fell lost balance"],
  [/\b(?:excavators?|shovels?|jcb|poclain|pokla[ie]n|loaders?|loads?|loading|dozers?)\b/, "excavator shovel loading machine bucket operator"],
  [/\b(?:machines?|machinery|repair\w*|maintenance|mechanic|fitter)\b/, "machine machinery operator maintenance"],
  [/\b(?:weld\w*|cutting|gas cutter|hot work)\b/, "welding gas cutting fire burn tank"],
  [/\b(?:fires?|aag|burn\w*|jal\w*)\b/, "fire burn injuries explosion"],
  [/\b(?:gas|methane|ventilation|hawa|smoke|dhuan)\b/, "methane gas atmosphere irrespirable ventilation"],
  [/\b(?:water|pa+ni|ponds?|talab|sumps?|floods?|swim\w*|doob\w*|drown\w*)\b/, "water drowned pond sump"],
  [/\b(?:pumps?|pontoon)\b/, "pump pontoon water"],
  [/\b(?:underground|neeche|andar)\b/, "belowground underground gallery"],
];
const VOCAB = new Set([...D.clf.terms, ...D.ret.terms]);
function stemFix(tok){ if(VOCAB.has(tok)) return tok; for(const suf of ["ing","ed","es","s","er"]){ if(tok.endsWith(suf)){ const b=tok.slice(0,-suf.length); if(VOCAB.has(b)) return b; if(VOCAB.has(b+"e")) return b+"e"; } } return tok; }
function expand(text){
  const low=text.toLowerCase(), words=(low.match(/[\p{L}\p{N}_]+/gu)||[]);
  const add=[]; for(const [re,terms] of PLAIN) if(re.test(low)) add.push(terms);
  const ground=/\b(?:stones?|rocks?|boulders?|patt?h?ar|chattan|walls?|sides?|de+war|di+var|bench\w*|roofs?|chh?a+t|highwall)\b/.test(low);
  const i=add.indexOf("FALL"); if(i>=0) add[i]=ground?"fall of sides parted":"fell";
  if(ground){ for(let j=0;j<words.length;j++) if(/^(?:fall\w*|fell|gir\w*)$/.test(words[j])) words[j]="parted"; }
  // short inputs lean on the dictionary; long sentences mostly speak for themselves
  const fixed=words.map(stemFix).join(" ");
  return words.length>=10 ? `${text} ${add.join(" ")}` : `${fixed} ${fixed} ${add.join(" ")}`;
}

function cut(s,n){ s=s.trim(); if(s.length<=n) return s; const t=s.slice(0,n); return t.slice(0,t.lastIndexOf(" "))+"…"; }
function titleCase(s){ return String(s).toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()); }
function shortMeasure(s){
  s=s.split(/[,;]?\s*(?:as required|as per (?:the )?(?:provision|regulation|reg)|in accordance with (?:the )?(?:provision|regulation|reg)|in compliance|under the provisions?|as stipulated|as laid down|thus (?:not )?negligently|thus not|in contravention|which was required)/i)[0];
  s=s.replace(/^(?:it|it has)\s+been\s+ensured\s+that\s+/i,"Ensure that ").replace(/\s*\(.*?Regulations?.*?\)/g,"").replace(/[\s,;.]+$/,"");
  return cut(s.charAt(0).toUpperCase()+s.slice(1),150);
}
function shortSit(s){
  let t=s.split(/,?\s*(?:due to which|inflicting|causing (?:him|her|them|serious|fatal|grievous)|resulting in|which proved fatal|who succumbed|to which)/i)[0];
  if(t.length<50) t=s;
  t=cut(t.replace(/[\s,;.]+$/,"").replace(/,?\s*thereby$/i,""),190);
  return /[.…]$/.test(t)?t:t+".";
}
// Group DGMS "Had..." findings from the matched accidents into plain-language points
const THEMES = [
  ["misfire",  /misfire|socket/i, "Before drilling, wash down and examine the rock for misfired holes and sockets. Never drill into or near an old hole."],
  ["shelter",  /shelter|danger zone|before (?:the )?firing|withdrawn .*blast|blast.*withdrawn|warning signal/i, "Before blasting, clear everyone out of the danger zone and make sure they are in proper shelter. Give the warning signal."],
  ["blaster",  /\bblasters?\b|shot ?firer|\bcharg(?:ing|ed)\b.*(?:hole|explosive)|\bexplosives?\b|detonat|stemm/i, "Only a trained, authorised blaster should handle, charge and fire explosives, following the blasting rules."],
  ["gas",      /\bgas\b|methane|ventilat|irrespirable|flame ?proof|hot work|welding|gas cutting|\bfires?\b/i, "Test for gas and make sure ventilation is good before entering or doing any hot work. Keep fire-fighting equipment ready."],
  ["electric", /\belectric(?:al|ity)?\b(?! rules)|\bearth(?:ing|ed)\b|\blive\b|\bcables?\b|insulat|overhead lines?|voltage|\bkv\b|\bswitch/i, "Treat all wires as live. Switch off, isolate and earth the supply before working, and keep clear of overhead lines."],
  ["water",    /(?<!with )\bwater\b(?! tanker)|\bponds?\b|\bsumps?\b|drown|inundat|pontoon|life ?jacket/i, "Fence and mark ponds, sumps and old flooded workings. Do not go near water without permission and a life jacket."],
  ["roof",     /\broof\b|systematic support|\bssr\b|\bcogs?\b|\bchocks?\b|roof bolt|\bprops?\b/i, "Keep the roof and sides supported as per the Systematic Support Rules before anyone works under them."],
  ["loose",    /\bdress(?:ed|ing)?\b|\bloose\b|overhang|under ?cut|made safe/i, "Check and dress loose stones and overhangs before starting. Keep loose material at least 3 m back from the bench edge."],
  ["bench",    /\bbench(?:es)?\b|\bslopes?\b|highwall|high wall/i, "Keep benches at the permitted height, width and slope. Do not undercut, and stay away from the bench edge."],
  ["height",   /safety belt|harness|\bladders?\b|working at height|from height|\bat a height|railing|hand ?rails?|scaffold/i, "When working at height, wear a safety belt or harness and use proper platforms, ladders and handrails."],
  ["guard",    /\bfenc|\bguard/i, "Fence and guard all moving parts (drums, pulleys, belts). Never clean or reach in while the machine is running."],
  ["isolate",  /isolat|switched off|\bstopp?ed\b|\block(?:ed|ing)? ?out\b|permit to work|shut ?down|de-?energi|immobil/i, "Stop the machine and isolate the power (lock it off) before repair, cleaning or freeing a jam. Use a permit to work."],
  ["proximity",/proximity|vicinity|blind ?spot|\bswing|no person|presence of (?:any )?person|run over|reach of/i, "Keep people out of the working range and blind spots of moving machines. Look all around before moving."],
  ["reverse",  /\brevers|\balarm|\bhorn\b|camera|banksman|spotter/i, "Use the reversing alarm and horn, and have a spotter when reversing or working in tight spaces."],
  ["road",     /\bhaul ?roads?\b|\broads?\b|traffic|\bberms?\b|parapet|gradient|\bspeed|\bply\b/i, "Keep haul roads wide, with gentle gradients, berms and traffic rules. Keep walkers and small vehicles away from dumpers."],
  ["vehicle",  /\bbrakes?\b|defect|fit condition|seat ?belt|\btyres?\b|steering/i, "Check brakes and the vehicle's condition before every shift. Never use a defective machine, and wear the seat belt."],
  ["light",    /illuminat|\blighting\b/i, "Make sure the workplace has enough lighting, especially at night."],
  ["train",    /\btrain(?:ed|ing)\b|\bcompetent\b|authori[sz]ed|qualified (?:driver|operator)|licen[cs]e|vocational/i, "Only trained, competent and authorised people should operate the machine or do the job."],
  ["sop",      /\bsop\b|safe operating|code of practice|\bcop\b|\bsmp\b|safety management plan|risk assess/i, "Follow the written SOP or code of practice for this job (from the mine's Safety Management Plan)."],
  ["supervise",/supervis|mining mate|foreman|overman|sirdar|competent person in charge/i, "Work only with a supervisor present: a Foreman, Mining Mate or Overman must be in charge and watching the job."],
  ["manager",  /manager|statutory officials?|placed under the charge|management, control/i, "Make sure the mine has a qualified manager and the required statutory officials appointed."],
];
function themesOf(m){ m=m.split(/[,;]?\s*(?:as required|under the provisions?|in accordance with the provisions?|thus (?:not )?negligently|in contravention)/i)[0]; const out=[]; for(const [key,re] of THEMES){ if(re.test(m)){ out.push(key); if(out.length===2) break; } } return out; }
function topMeasures(hits, n=5){
  const agg=new Map();
  hits.forEach(({r,score},rank)=>{
    const w=Math.max(score,0.01)*(1-rank*0.08), seen=new Set();
    for(const m of r.measures.split("|").map(x=>x.trim()).filter(Boolean)){
      const ks=themesOf(m); const regs=(m.match(/Reg(?:ulation)?s?\.?\s*(?:No\.?\s*)?\d+(?:\(\w+\))*/gi)||[]).map(x=>"Reg "+x.match(/\d+(?:\(\w+\))*/)[0]).filter(x=>!/^Reg (?:19|20)\d\d$/.test(x));
      for(const k of ks){
        const a=agg.get(k)||{k,w:0,ids:new Set(),regs:new Set()};
        if(!seen.has(k)){ a.w+=w; seen.add(k); }
        a.ids.add(r.id); regs.forEach(x=>a.regs.add(x)); agg.set(k,a);
      }
      if(!ks.length){ const k="x:"+m.slice(0,40); if(!agg.has(k)) agg.set(k,{k,w:w*0.6,ids:new Set([r.id]),regs:new Set(regs),text:shortMeasure(m)}); }
    }
  });
  const T=Object.fromEntries(THEMES.map(([k,,t])=>[k,t]));
  const all=[...agg.values()].sort((a,b)=>b.w-a.w); const strong=all.filter(a=>a.ids.size>=2), weak=all.filter(a=>a.ids.size<2);
  return [...strong,...weak].slice(0,Math.max(3,Math.min(n,strong.length||3))).map(a=>({text:a.text||T[a.k],ids:[...a.ids],regs:[...a.regs].slice(0,3)}));
}

// ---------- UI ----------
function measuresHTML(s){ return s.split("|").map(x=>x.trim()).filter(Boolean).map(x=>`<li><em>Had</em> ${esc(x)}</li>`).join(""); }
function poolSize(place,mt){ return KB.filter(r=>(!place||r.place===place||(place==="Opencast"&&r.place==="Above Ground"))&&(!mt||r.mine_type===mt)).length; }
const ICON_PATHS = {
  "Explosives": '<path d="M12 2l1.8 5.2L19 5l-2.2 5L22 12l-5.2 1.8L19 19l-5.2-2.2L12 22l-1.8-5.2L5 19l2.2-5.2L2 12l5.2-1.8L5 5l5.2 2.2z"/>',
  "Ground movement": '<path d="M3 20h18"/><path d="M4 20l5-9 3 4 3-6 5 11"/><path d="M14 4l-1 3 2 1-1 3"/>',
  "Transportation machinery": '<path d="M2 16V8h11v8"/><path d="M13 11h4l4 4v1h-8"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/>',
  "Machinery other than transportation machinery": '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  "Electricity": '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  "Falls (other than falls of ground)": '<path d="M7 2v20M15 2v20M7 6h8M7 11h8M7 16h8"/><path d="M20 9v8m-2-2l2 2 2-2"/>',
  "Gas, dust & other combustible material": '<path d="M12 22c4 0 7-2.7 7-6.8 0-3.3-2.2-5.4-3.6-7.6-.8 2-2 3-3.4 3.4.6-3.4-.6-6.2-3-9-.2 3.4-1.6 5.4-3.2 7.4C4.6 11.2 5 13.6 5 15.2 5 19.3 8 22 12 22z"/>',
  "Other causes": '<path d="M12 3L2 20h20z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/>'
};
const icon = h => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[h]||ICON_PATHS["Other causes"]}</svg>`;

for(const p of D.places){ if(p==="Above Ground") continue; $("place").add(new Option(p,p)); }
for(const m of D.mine_types) $("mt").add(new Option(m.replace(/ \(DGMS.*\)/,""),m));
const EXAMPLES = [
  ["Drilling holes on a bench near an old blasted area in an opencast granite quarry","Opencast",""],
  ["Support crew erecting chocks at the goaf edge of a depillaring panel in an underground coal mine","Below Ground","Coal"],
  ["Dumper reversing near the edge of a dump yard at night with poor lighting","Opencast",""],
  ["Electrician working on a 3.3 kV cable joint near the conveyor drive","",""],
  ["Gas testing before blasting in a degree III gassy seam","Below Ground","Coal"],
  ["Worker cleaning spillage under a running belt conveyor at the transfer point","",""]
];
function setPressed(btn){ document.querySelectorAll("#ex .chip").forEach(c=>c.setAttribute("aria-pressed", c===btn?"true":"false")); }
EXAMPLES.forEach(([t,p,m])=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.setAttribute("aria-pressed","false");
  b.textContent=t; b.title=t;
  b.onclick=()=>{ $("q").value=t; $("place").value=p; $("mt").value=m; setPressed(b); submit(); }; $("ex").append(b); });
$("q").addEventListener("input",()=>setPressed(null));

let last=null, ctl=null;
function confClass(p){ return p>=0.35?"hi":p>=0.2?"mid":"lo"; }
function confWord(p){ return p>=0.35?"Strong match":p>=0.2?"Moderate":"Weak, check alternatives"; }

// Why a record was retrieved: the search terms that contributed most to its similarity, plus the hazard bonus if applied
function sharedTerms(qv, i, n=3){
  const d=DOCS[i], out=[];
  for(const [j,w] of qv){ const x=d.get(j); if(x) out.push([D.ret.terms[j], x*w]); }
  out.sort((a,b)=>b[1]-a[1]);
  const picked=[]; for(const [t] of out){ if(picked.some(p=>p.includes(t)||t.includes(p))) continue; picked.push(t); if(picked.length===n) break; }
  return picked;
}
const KB_INDEX = new Map(KB.map((r,i)=>[r,i]));

function idle(){
  $("out").innerHTML=`<div class="empty card reveal">${icon("Other causes")}<p><b>Ready.</b> Describe the job you are going to do, or pick an example, then press <b>Find precedents</b>. The likely hazard, the key preventive measures and similar past accidents will appear here.</p></div>`;
}

function submit(){
  const btn=$("go"); btn.disabled=true; btn.classList.add("busy"); $("goT").textContent="Analysing…";
  setTimeout(()=>{ try{ run(); } finally { btn.disabled=false; btn.classList.remove("busy"); $("goT").textContent="Find precedents"; } }, 140);
}

function interp(p){ return p>=0.35?"Strong match":p>=0.2?"Moderate match":"Weak match"; }

function run(){
  const text=$("q").value.trim(), place=$("place").value, mt=$("mt").value;
  const out=$("out");
  if(text.length<2){ out.innerHTML=`<div class="empty card reveal">${icon("Other causes")}<p><b>Nothing to analyse yet.</b> Type the job you are going to do, for example: blasting, truck, roof, wire, water.</p></div>`; $("q").focus(); return; }
  const q=expand(text), probs=classify(q), hz=probs[0];
  const hits=search(q,{place,mineType:mt,hazard:hz.hazard});
  const qv=vectorize(q, RET_IDX, D.ret.idf);
  last={text,place,mt,probs,hits};
  const pct=p=>(p*100).toFixed(0);
  const alts=probs.slice(0,4).map((c,i)=>`<div class="bar ${i===0?"top":""}"><span>${esc(c.hazard)}</span><span class="p">${pct(c.p)}%</span><div class="track"><div class="fill" data-w="${(c.p*100).toFixed(1)}"></div></div></div>`).join("");
  const acts=topMeasures(hits).map((m,i)=>`
    <li class="act card"><span class="num" aria-hidden="true">${i+1}</span><span class="t">${esc(m.text)}</span>
      <details class="ev"><summary>Based on ${m.ids.length} past accident${m.ids.length>1?"s":""}</summary><p>${m.ids.map(esc).join(", ")}${m.regs.length?" · "+m.regs.map(esc).join(", "):""}</p></details></li>`).join("");
  const cases=hits.length?hits.map(({r,score})=>{
    const ms=r.measures.split("|").map(x=>x.trim()).filter(Boolean);
    const regs=[...new Set((r.regulations.match(/Reg \d+(?:\(\w+\))*|Sec(?:tion)? \d+(?:\(\w+\))*/g)||[]))].slice(0,4);
    const terms=sharedTerms(qv, KB_INDEX.get(r));
    const why=[terms.length?"shared terms: "+terms.join(", "):"", r.hazard===hz.hazard?"same hazard group (+0.10)":""].filter(Boolean).join(" · ");
    return `
    <article class="case card reveal">
      <div class="case-h"><h3 class="mine">${esc(titleCase(r.mine_name))}</h3><span class="yr">${esc(String(r.year))}</span>
        <span class="killed">${r.persons_killed} killed</span></div>
      <p class="sit">${esc(shortSit(r.situation))}</p>
      <div class="findings"><h4>Key finding${ms.length>1?"s":""}</h4>
        <ul class="lessons">${ms.slice(0,2).map(m=>`<li>${esc(shortMeasure(m))}</li>`).join("")}</ul></div>
      <div class="src"><b>${esc(r.source_document)}</b>, PDF p.${esc(r.source_page)}${regs.length?` · ${regs.map(esc).join(", ")}`:""}</div>
      <details class="more"><summary>More details</summary>
        <div class="full">
          <dl class="kv">
            <dt>Record</dt><dd>${esc(r.id)} · ${esc(r.date)}</dd>
            <dt>Location</dt><dd>${esc(r.state)} · ${esc(r.mineral)} · ${esc(r.place)}</dd>
            <dt>DGMS cause</dt><dd>${esc(r.cause_group)} → ${esc(r.cause_subgroup)}</dd>
            <dt>Why it matched</dt><dd>${esc(why||"—")} · similarity ${score.toFixed(2)}</dd>
            <dt>Regulations</dt><dd>${esc(r.regulations)}</dd>
            <dt>Statutes</dt><dd>${esc(r.statutes_cited)}</dd>
          </dl>
          <p class="sit">${esc(r.situation)}</p>
          <div class="findings"><h4>All DGMS findings: the accident could have been averted…</h4><ul class="measures">${measuresHTML(r.measures)}</ul></div>
        </div>
      </details>
    </article>`}).join(""):`<div class="empty card">${icon("Other causes")}<p><b>No records match those filters.</b> Set Place of work or Mine type to Any and try again.</p></div>`;
  out.innerHTML=`
    <div class="hazard card reveal" role="group" aria-label="Hazard assessment">
      <div class="hz-main">
        <span class="label">Most likely hazard</span>
        <div class="hz-title"><span class="hz-icon">${icon(hz.hazard)}</span><h2 class="hz-name${hz.hazard.length>16?" long":""}">${esc(hz.hazard)}</h2></div>
        <div class="score"><span class="v">${pct(hz.p)}%</span><span class="k">classifier confidence</span><span class="badge ${confClass(hz.p)}"><i aria-hidden="true"></i>${interp(hz.p)}</span></div>
        <div class="gauge" role="img" aria-label="Classifier confidence ${pct(hz.p)} percent"><b data-w="${(hz.p*100).toFixed(1)}"></b></div>
        <p class="interp">How sure the model is that your description belongs to this DGMS hazard group. It is not the probability of an accident. Strong ≥ 35%, moderate 20–34%, weak below 20%.</p>
      </div>
      <div class="alts">
        <span class="label">Hazard ranking</span>
        ${alts}
      </div>
    </div>
    <div class="block reveal">
      <div class="sec-h"><h2>Preventive measures</h2><span class="sub">From the ${hits.length} closest accidents</span></div>
      <ol class="acts">${acts}</ol>
    </div>
    <div class="advice card reveal" id="adv" hidden>
      <div class="sec-h"><h2>More recommendations</h2></div>
      <p class="why">Claude suggests measures not already listed above, using the DGMS findings of the ${hits.length} accidents below and the job you described.</p>
      <div class="advice-body" id="advBody"></div>
      <div class="btns"><button type="button" class="btn2" id="advGo">Get more recommendations</button><button type="button" class="btn2" id="advStop" hidden>Stop</button></div>
      <p class="note" id="advNote"></p>
    </div>
    <div class="block">
      <div class="sec-h reveal"><h2>Closest past accidents</h2><span class="sub">${hits.length} of ${poolSize(place,mt)} DGMS records${place||mt?" (filtered)":""}</span></div>
      <div class="cases">${cases}</div>
    </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ out.querySelectorAll("[data-w]").forEach(el=>{ el.style.width=el.dataset.w+"%"; }); }));
  wireAdvice();
}

let sample=null;
function wireAdvice(){
  const box=$("adv"); if(!box) return;
  box.hidden=!sample || !last.hits.length;
  $("advGo").onclick=askClaude; $("advStop").onclick=()=>ctl?.abort();
}
function buildPrompt(){
  const shown=topMeasures(last.hits).map((m,i)=>`${i+1}. ${m.text}`).join("\n");
  const recs=last.hits.map(({r})=>`[${r.id}] ${r.year}, ${r.place}, ${r.mine_type}, ${r.mineral}. Cause: ${r.cause_group} / ${r.cause_subgroup}.
What happened: ${r.situation}
DGMS: the accident could have been averted had ${r.measures.split("|").map(s=>s.trim()).join("; had ")}
Regulations: ${r.regulations}`).join("\n\n");
  return `You are a mine-safety assistant for Indian mines, writing for a miner in simple English.

The miner's job: ${last.text}
Place: ${last.place||"not stated"} | Mine type: ${last.mt||"not stated"}
Likely hazard: ${last.probs[0].hazard}

The miner has ALREADY been shown these preventive measures:
${shown}

Your task: give 5 to 7 OTHER preventive measures for this job that are NOT in the list above. Do not repeat or reword any of them, and do not give general advice that one of them already covers (for example, if supervision is listed, do not suggest supervision again).

Draw first on the past DGMS fatal-accident findings below, picking findings the list above does not cover. Then you may add practical steps specific to this job (checks before starting, what to watch for while working, when to stop and tell the supervisor).

Past accidents:
${recs}

Format: plain text, a numbered list only, one short sentence per point in simple words, no headings, no bold, no record ids, no regulation numbers, no introduction and no closing line.`;
}
async function askClaude(){
  const go=$("advGo"), stop=$("advStop"), body=$("advBody"), note=$("advNote");
  ctl=new AbortController(); go.disabled=true; stop.hidden=false; body.textContent="Thinking…";
  try{
    const {truncated}=await sample(buildPrompt(),{cache:false,signal:ctl.signal,onText:({text})=>{body.textContent=text;}});
    note.textContent=truncated?"The answer was cut short. Try a shorter situation.":"";
    go.textContent="Get different recommendations";
  }catch(e){
    body.textContent=e.text??"";
    const msg={not_granted:"Claude access was not allowed for this page.",sampling_disabled:"Claude is not available for this account.",rate_limited:"Too many requests just now. Try again in a minute.",session_expired:"Sign in to Claude again, then retry.",refused:"Claude declined this request. Rephrase the situation."}[e.code];
    if(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared"){ $("adv").hidden=true; sample=null; }
    else if(e.code!=="cancelled") note.textContent=msg||"The request failed. Try again.";
  }finally{ go.disabled=false; stop.hidden=true; }
}

$("f").addEventListener("submit",e=>{e.preventDefault();submit();});
$("q").value=""; $("place").value=""; $("mt").value="";
idle();
(async()=>{ try{ sample=await window.claude?.use?.("sample"); }catch{ sample=null; } if(last) wireAdvice(); })();
</script>
